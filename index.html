<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="description" content="罗小黑战记辟谣查询工具 - 提供罗小黑战记、制作团队及关联作品相关谣言的分类查询、关键词检索、辟谣内容复制等服务">
    <meta name="keywords" content="罗小黑战记,辟谣,查询,工具,MTJJ,寒木春华">
    
    <!-- 浏览器标签图标 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- iOS 主屏幕配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="罗小黑辟谣">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <title>罗小黑战记辟谣查询</title>
    
    <!-- 外部CSS文件 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <button id="darkModeBtn" aria-label="切换深色模式">深色模式</button>
        <button class="category-btn" id="categoryBtn" aria-label="打开分类菜单">分类</button>
        <button class="download-btn" id="downloadBtn" aria-label="下载客户端">下载客户端</button>
    </div>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <div class="main-container">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar" aria-label="分类菜单" aria-hidden="true">
            <div class="sidebar-header">全部分类</div>
            <div id="categoryContainer"></div>
        </div>

        <!-- 主内容区 -->
        <div class="content-area">
            <!-- 标题和搜索框容器（初始居中） -->
            <div class="center-wrapper" id="centerWrapper">
                <div class="big-title" id="bigTitle">罗小黑战记辟谣查询</div>
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="输入关键词" aria-label="搜索关键词">
                    <button id="searchBtn" aria-label="搜索">🔍</button>
                </div>
                <!-- 加载动画 -->
                <div id="loading" class="loading">加载中...</div>
            </div>
            <!-- 搜索结果区域 -->
            <div class="result-box" id="resultBox" aria-label="搜索结果"></div>
        </div>
    </div>

    <!-- 下载平台选择弹窗 -->
    <div id="downloadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>选择下载平台</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <button class="platform-btn" id="downloadWindows">下载Windows版本</button>
                <button class="platform-btn" id="downloadAndroid">下载Android版本</button>
                <button class="platform-btn" id="addIOS">下载iOS版本</button>
            </div>
        </div>
    </div>

    <!-- 图片查看器 -->
    <div class="image-viewer" id="imageViewer">
        <div class="image-viewer-content">
            <button class="image-viewer-btn prev-btn" id="prevBtn">←</button>
            <img id="viewerImage" src="" alt="图片">
            <button class="image-viewer-btn next-btn" id="nextBtn">→</button>
            <button class="close-btn" id="closeViewerBtn">×</button>
            <div class="image-count" id="imageCount">1/1</div>
        </div>
    </div>

    <!-- 外部JavaScript文件 -->
    <script src="js/main.js"></script>
</body>
</html>
