<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="罗小黑战记辟谣查询工具 - 提供罗小黑战记、制作团队及关联作品相关谣言的分类查询、关键词检索、辟谣内容复制等服务">
    <meta name="keywords" content="罗小黑战记,辟谣,查询,工具,MTJJ,寒木春华">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="罗小黑辟谣">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <title>罗小黑战记辟谣查询</title>
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    <!-- 动态背景 -->
    <canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>
    <div class="ambient-light" aria-hidden="true"></div>
    <div class="ambient-light alt" aria-hidden="true"></div>

    <!-- 顶部工具栏 -->
    <header class="app-toolbar" id="appToolbar">
        <div class="toolbar-left">
            <button class="toolbar-btn icon-btn" id="categoryBtn" aria-label="打开分类菜单" title="分类">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
                </svg>
            </button>
            <div class="brand-mini">
                <span class="brand-icon"></span>
                <span data-i18n="app_title">罗小黑战记辟谣查询</span>
            </div>
        </div>
        <div class="toolbar-right">
            <button class="toolbar-btn theme-toggle" id="darkModeBtn" aria-label="切换深色模式">
                <span class="theme-icon sun">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM2 13h2a1 1 0 100-2H2a1 1 0 100 2zm18 0h2a1 1 0 100-2h-2a1 1 0 100 2zM11 2v2a1 1 0 102 0V2a1 1 0 10-2 0zm0 18v2a1 1 0 102 0v-2a1 1 0 10-2 0zM5.99 4.58a1 1 0 10-1.41 1.41l1.41 1.41a1 1 0 101.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 10-1.41 1.41l1.41 1.41a1 1 0 101.41-1.41l-1.41-1.41zm1.41-10.96a1 1 0 10-1.41-1.41l-1.41 1.41a1 1 0 101.41 1.41l1.41-1.41zM7.4 17.01a1 1 0 10-1.41-1.41l-1.41 1.41a1 1 0 101.41 1.41l1.41-1.41z"/></svg>
                </span>
                <span class="theme-icon moon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
                </span>
            </button>
            <div class="lang-select-wrap">
                <select id="languageSelect" class="language-select" aria-label="选择语言">
                    <option value="zh_cn">简体中文</option>
                    <option value="zh_tw">繁體中文</option>
                    <option value="en_gb">English</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="ru">Русский</option>
                </select>
            </div>
            <button class="toolbar-btn download-btn" id="downloadBtn" aria-label="下载客户端">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span data-i18n="download_client">下载客户端</span>
            </button>
        </div>
    </header>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <div class="app-body">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar" aria-label="分类菜单" aria-hidden="true">
            <div class="sidebar-header">
                <span data-i18n="all_categories">全部分类</span>
                <button class="close-sidebar" id="closeSidebar" aria-label="关闭分类菜单">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="category-container" id="categoryContainer"></div>
        </aside>

        <!-- 主内容区 -->
        <main class="content-area" id="contentArea">
            <!-- 首页 -->
            <section class="hero-section" id="heroSection">
                <div class="hero-content">
                    <h1 class="hero-title" id="heroTitle" data-i18n="app_title">罗小黑战记辟谣查询</h1>
                    <p class="hero-subtitle" id="heroSubtitle" data-i18n="hero_subtitle">输入关键词，快速查找相关辟谣内容</p>

                    <div class="search-box" id="searchBox">
                        <div class="search-inner">
                            <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 001.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 00-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 005.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="输入关键词搜索" aria-label="搜索关键词" autocomplete="off">
                            <button class="search-clear" id="searchClear" aria-label="清空搜索">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                            </button>
                            <button class="search-submit" id="searchBtn" data-i18n-title="search" aria-label="搜索">搜索</button>
                        </div>
                        <div class="search-history" id="searchHistory"></div>
                    </div>
                </div>
            </section>

            <!-- 结果区域 -->
            <section class="result-section" id="resultSection" aria-label="搜索结果">
                <div class="result-header">
                    <button class="btn btn-ghost back-home-btn" id="backHomeBtn">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        <span data-i18n="back_to_home">返回主页</span>
                    </button>
                    <div class="result-meta" id="resultMeta"></div>
                </div>
                <div class="result-box" id="resultBox"></div>
            </section>
        </main>
    </div>

    <!-- 下载平台选择弹窗 -->
    <div class="modal" id="downloadModal" role="dialog" aria-modal="true" aria-labelledby="downloadModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="downloadModalTitle" data-i18n="select_platform">选择下载平台</h3>
                <button class="modal-close" id="closeModal" aria-label="关闭">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <button class="platform-btn windows" id="downloadWindows">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 12V6.75l6-1.32v6.48L3 12zm17-9v8.75l-10 .15V5.21L20 3zM3 13l6 .09v6.81l-6-1.15V13zm17 .25V22l-10-1.91V13.1l10 .15z"/></svg>
                    <span data-i18n="download_windows">下载Windows版本</span>
                </button>
                <button class="platform-btn android" id="downloadAndroid">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993.0001.5511-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0225 3.503C15.5902 8.4791 13.853 8.0281 12 8.0281c-1.853 0-3.5902.451-5.1369 1.2443L4.8406 5.7692a.416.416 0 00-.5676-.1521.416.416 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589.3432 18.6617h23.3136c0-4.0028-2.3457-7.475-5.775-9.3403"/></svg>
                    <span data-i18n="download_android">下载Android版本</span>
                </button>
                <button class="platform-btn ios" id="addIOS">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                    <span data-i18n="download_ios">下载iOS版本</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 图片查看器 -->
    <div class="image-viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="图片查看器">
        <div class="image-viewer-backdrop"></div>
        <div class="image-viewer-content">
            <button class="viewer-btn close-btn" id="closeViewerBtn" aria-label="关闭">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <button class="viewer-btn nav-btn prev-btn" id="prevBtn" aria-label="上一张">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="viewer-image-wrap">
                <img id="viewerImage" src="" alt="图片">
            </div>
            <button class="viewer-btn nav-btn next-btn" id="nextBtn" aria-label="下一张">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
            <div class="image-count" id="imageCount">1/1</div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 返回顶部 -->
    <button class="back-to-top" id="backToTop" aria-label="返回顶部">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    </button>

    <script src="js/rumor_data_all.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/main.js?v=8"></script>
</body>
</html>
