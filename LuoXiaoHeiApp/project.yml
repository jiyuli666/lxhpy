name: LuoXiaoHei
options:
  bundleIdPrefix: com.lxhpy
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.0"
  projectFormat: xcode13
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_BITCODE: NO
    INFOPLIST_FILE: LuoXiaoHei/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: 罗小黑战记辟谣查询
    INFOPLIST_KEY_CFBundleName: 罗小黑战记
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_ASSET_PATHS: '"LuoXiaoHei/Preview Content"'
targets:
  LuoXiaoHei:
    type: application
    platform: iOS
    sources:
      - path: LuoXiaoHei/AppDelegate.swift
      - path: LuoXiaoHei/Sources
    resources:
      - path: LuoXiaoHei/Resources
      - path: LuoXiaoHei/Assets.xcassets
      - path: LuoXiaoHei/Base.lproj/LaunchScreen.storyboard
      - path: LuoXiaoHei/Preview Content
    info:
      path: LuoXiaoHei/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
    entitlements:
      path: LuoXiaoHei/LuoXiaoHei.entitlements
      properties:
        com.apple.security.network.client: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lxhpy.luoxiaohei
      PRODUCT_NAME: LuoXiaoHei
      MARKETING_VERSION: "1.5.1"
      CURRENT_PROJECT_VERSION: "1"
