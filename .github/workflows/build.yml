name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept all licenses and install stable components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;25.2.9519653"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev

      - name: Install buildozer and cython
        run: |
          pip install --user cython buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Prepare buildozer SDK cache
        run: |
          # 创建 buildozer 期望的 SDK 目录
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk
          # 复制系统 SDK 所有文件到该目录
          cp -r /usr/local/lib/android/sdk/* /home/runner/.buildozer/android/platform/android-sdk/
          # 创建符号链接以满足 buildozer 的路径期望 (tools -> cmdline-tools/latest)
          cd /home/runner/.buildozer/android/platform/android-sdk
          ln -s cmdline-tools/latest tools
          # 创建 NDK 符号链接 (ndk-bundle -> ndk/25.2.9519653)
          ln -s ndk/25.2.9519653 ndk-bundle

      - name: Build with buildozer
        run: |
          export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luoxiaohei-apk
          path: bin/*.apk
