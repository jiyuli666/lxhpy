name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: LuoXiaoHeiApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Step 1 - 检查所有源文件和资源文件是否存在
        run: |
          echo "== 1A. 工作目录和内容 =="
          pwd
          ls -la
          echo ""
          echo "== 1B. LuoXiaoHei 目录内容 =="
          ls -la LuoXiaoHei/
          echo ""
          echo "== 1C. Sources/ Swift 文件数 =="
          if [ -d "LuoXiaoHei/Sources" ]; then
            ls LuoXiaoHei/Sources/*.swift 2>/dev/null | wc -l
            ls LuoXiaoHei/Sources/
          else
            echo "Sources 目录不存在"
          fi
          echo ""
          echo "== 1D. Resources/ 资源文件（关键！48 个文件） =="
          if [ -d "LuoXiaoHei/Resources" ]; then
            echo "目录存在"
            ls -la LuoXiaoHei/Resources/
            echo ""
            echo "文件总数: $(ls LuoXiaoHei/Resources/ | wc -l | tr -d ' ')"
            echo "目录大小: $(du -sh LuoXiaoHei/Resources/ | awk '{print $1}')"
            echo ""
            echo "按扩展名统计:"
            ls LuoXiaoHei/Resources/*.jpg 2>/dev/null | wc -l | tr -d ' ' | xargs -I{} echo "  .jpg: {} 个"
            ls LuoXiaoHei/Resources/*.png 2>/dev/null | wc -l | tr -d ' ' | xargs -I{} echo "  .png: {} 个"
            ls LuoXiaoHei/Resources/*.json 2>/dev/null | wc -l | tr -d ' ' | xargs -I{} echo "  .json: {} 个"
            ls LuoXiaoHei/Resources/*.md 2>/dev/null | wc -l | tr -d ' ' | xargs -I{} echo "  .md: {} 个"
          else
            echo "Resources 目录不存在！"
          fi
          echo ""
          echo "== 1E. AppDelegate.swift =="
          ls -lh LuoXiaoHei/AppDelegate.swift 2>/dev/null || echo "不存在"
          echo ""
          echo "== 1F. Info.plist =="
          ls -lh LuoXiaoHei/Info.plist 2>/dev/null || echo "不存在"

      - name: Step 2 - 安装工具并显示版本
        run: |
          xcodebuild -version
          brew install xcodegen || true
          xcodegen --version || echo "xcodegen not found"

      - name: Step 3 - 生成 Xcode 项目
        run: |
          echo "== xcodegen generate =="
          xcodegen generate
          echo ""
          ls -la LuoXiaoHei.xcodeproj/

      - name: Step 4 - 构建 iOS 应用
        run: |
          set -o pipefail
          xcodebuild \
            -project LuoXiaoHei.xcodeproj \
            -scheme LuoXiaoHei \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            build \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath "$PWD/DerivedData" \
            2>&1 | tee build.log | tail -40
          echo ""
          echo "构建完成，退出码: ${PIPESTATUS[0]}"

      # === 关键修复：手动把 Resources 目录的文件 + 图标文件复制进 .app 包 ===
      - name: Step 4.5 - 手动复制资源文件和图标到 app bundle
        run: |
          APP_DIR="$PWD/DerivedData/Build/Products/Release-iphoneos/LuoXiaoHei.app"
          echo "== 复制前 .app 大小 =="
          du -sh "$APP_DIR"
          echo ""
          echo "== 关键：可执行文件名（必须与 Info.plist CFBundleExecutable 匹配） =="
          ls -lh "$APP_DIR" | grep -E "^-" | head -5
          echo ""
          echo "== 关键：有没有 Assets.car （图标文件） =="
          ls -lh "$APP_DIR/Assets.car" 2>/dev/null || echo "❌ 没有 Assets.car"
          echo ""
          echo "== 复制 Resources/ 数据文件和图片 =="
          if [ -d "LuoXiaoHei/Resources" ]; then
            cp -v LuoXiaoHei/Resources/*.jpg "$APP_DIR/" 2>/dev/null
            cp -v LuoXiaoHei/Resources/*.png "$APP_DIR/" 2>/dev/null
            cp -v LuoXiaoHei/Resources/*.json "$APP_DIR/" 2>/dev/null
            cp -v LuoXiaoHei/Resources/*.md "$APP_DIR/" 2>/dev/null
            echo "✅ Resources 复制完成"
          else
            echo "⚠️ Resources 目录不存在"
          fi
          echo ""
          echo "== 复制 AppIcon 图标文件到 .app 包（不依赖 Assets.car） =="
          if [ -d "LuoXiaoHei/Assets.xcassets/AppIcon.appiconset" ]; then
            # 1. 复制所有图标 PNG 到 .app 包根目录
            for icon in LuoXiaoHei/Assets.xcassets/AppIcon.appiconset/AppIcon-*.png; do
              if [ -f "$icon" ]; then
                basename_icon=$(basename "$icon")
                cp -v "$icon" "$APP_DIR/$basename_icon"
              fi
            done
            # 2. 把 @1x 的文件复制一份为不带后缀的版本（iOS 会自动找 AppIcon-20x20.png）
            for icon1x in "$APP_DIR"/AppIcon-*@1x.png; do
              if [ -f "$icon1x" ]; then
                plain_name=$(basename "$icon1x" | sed 's/@1x//')
                cp -v "$icon1x" "$APP_DIR/$plain_name"
              fi
            done
            echo "✅ 图标复制完成"
            echo "已复制的图标文件:"
            ls -lh "$APP_DIR"/AppIcon-*.png | head -10
          else
            echo "⚠️ AppIcon 目录不存在"
          fi
          echo ""
          echo "=============================================="
          echo "=== 关键：用 plutil 直接写入 Info.plist ==="
          echo "=============================================="
          # 1. 设置应用显示名称和 Bundle Name
          plutil -replace CFBundleDisplayName -string "罗小黑战记辟谣查询" "$APP_DIR/Info.plist"
          plutil -replace CFBundleName -string "罗小黑战记" "$APP_DIR/Info.plist"
          plutil -replace CFBundleExecutable -string "LuoXiaoHei" "$APP_DIR/Info.plist"
          plutil -replace CFBundleIdentifier -string "com.lxhpy.luoxiaohei" "$APP_DIR/Info.plist"
          plutil -replace CFBundleShortVersionString -string "1.5.1" "$APP_DIR/Info.plist"
          plutil -replace CFBundleVersion -string "1" "$APP_DIR/Info.plist"
          plutil -replace MinimumOSVersion -string "14.0" "$APP_DIR/Info.plist"
          # 2. 移除 UIApplicationSceneManifest（走传统 AppDelegate 启动）
          plutil -remove UIApplicationSceneManifest "$APP_DIR/Info.plist" 2>/dev/null || true
          # 3. 设置图标（CFBundleIconFiles 方式，不依赖 Assets.car）
          plutil -replace CFBundleIcons -json '{"CFBundlePrimaryIcon":{"CFBundleIconFiles":["AppIcon-20x20","AppIcon-29x29","AppIcon-40x40","AppIcon-60x60","AppIcon-76x76","AppIcon-83.5x83.5","AppIcon-1024x1024"]}}' "$APP_DIR/Info.plist"
          plutil -replace "CFBundleIcons~ipad" -json '{"CFBundlePrimaryIcon":{"CFBundleIconFiles":["AppIcon-20x20","AppIcon-29x29","AppIcon-40x40","AppIcon-76x76","AppIcon-83.5x83.5","AppIcon-1024x1024"]}}' "$APP_DIR/Info.plist"
          echo "✅ Info.plist 已更新"
          echo ""
          echo "== 复制后 .app 大小 =="
          du -sh "$APP_DIR"
          echo ""
          echo "== .app 包内文件总数 =="
          find "$APP_DIR" -type f | wc -l
          echo ""
          echo "== 关键资源文件检查 =="
          echo "rumor_data.json:"; ls -lh "$APP_DIR/rumor_data.json" 2>&1 || true
          echo "zh_cn.json:"; ls -lh "$APP_DIR/zh_cn.json" 2>&1 || true
          echo ""
          echo "== 图标文件检查 =="
          echo "AppIcon-60x60@2x.png:"; ls -lh "$APP_DIR/AppIcon-60x60@2x.png" 2>&1 || true
          echo "AppIcon-60x60@3x.png:"; ls -lh "$APP_DIR/AppIcon-60x60@3x.png" 2>&1 || true
          echo ""
          echo "== .app 包内 Info.plist 关键信息（plutil 解析） =="
          plutil -p "$APP_DIR/Info.plist" 2>&1 | grep -E "CFBundle|DisplayName|BundleName|BundleExec|Icon|Scene|ApplicationSceneManifest" | head -30 || true
          echo ""
          echo "== Info.plist XML 全文（前 60 行） =="
          plutil -convert xml1 -o - "$APP_DIR/Info.plist" 2>&1 | head -60 || true
          echo ""
          echo "== .app 包内的完整文件列表 =="
          ls -lh "$APP_DIR/"

      - name: Step 5 - 打包成 IPA
        run: |
          APP_DIR="$PWD/DerivedData/Build/Products/Release-iphoneos/LuoXiaoHei.app"
          rm -rf Package
          mkdir -p Package/Payload
          cp -R "$APP_DIR" Package/Payload/
          echo "== Payload 大小 =="
          du -sh Package/Payload/LuoXiaoHei.app
          echo ""
          echo "== 正在打包 IPA =="
          cd Package
          zip -qr ../LuoXiaoHei.ipa .
          cd ..
          echo ""
          echo "== 完成！IPA 文件 =="
          ls -lh LuoXiaoHei.ipa
          SIZE_BYTES=$(stat -f%z LuoXiaoHei.ipa 2>/dev/null || stat -c%s LuoXiaoHei.ipa 2>/dev/null)
          echo "大小: $SIZE_BYTES 字节 ($(echo "$SIZE_BYTES/1024/1024" | bc -l | cut -c1-4) MB)"

      - name: Step 6 - 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuoXiaoHei-IPA
          path: LuoXiaoHeiApp/LuoXiaoHei.ipa
          retention-days: 30

      - name: 失败时上传构建日志
        if: failure()
        run: |
          echo "构建失败，检查 DerivedData..."
          ls -la LuoXiaoHeiApp/DerivedData/Build/Products/Release-iphoneos/ 2>/dev/null || echo "路径不存在"
        working-directory: .
